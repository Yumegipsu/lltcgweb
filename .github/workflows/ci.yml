name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, curl, mbstring
          coverage: none

      - name: Install Composer deps
        run: composer install --no-interaction --prefer-dist

      - name: Validate JSON
        run: php scripts/validate_json.php

      - name: Validate cards
        run: php scripts/validate_cards.php

      - name: Validate ability IR
        run: php scripts/validate_ability_ir.php

      - name: PHP lint
        run: bash scripts/lint_php.sh

      - name: PHPUnit
        run: composer test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Presentation heal / Live Win-Loss contracts
        run: node scripts/test_presentation_guards.mjs

      - name: CPU prompt / scorer contracts
        run: |
          node scripts/audit_card_interactions.mjs --write=reports/card_interaction_matrix.json
          python scripts/audit_cpu_prompts.py
          node scripts/test_cpu_scorers.mjs

      - name: Portrait web responsive contracts
        run: node scripts/test_portrait_responsive.mjs

  docker-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - name: Build and smoke test container
        run: |
          docker compose build
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8080/api.php?action=ping" | grep -q '"ok"'; then
              echo "Smoke OK"
              docker compose down
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          docker compose down
          exit 1
