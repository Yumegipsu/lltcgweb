# Deny HTTP access to writable runtime directories
<Directory /var/www/html/data>
    Require all denied
</Directory>
<Directory /var/www/html/games>
    Require all denied
</Directory>
<Directory /var/www/html/experiment_decks>
    Require all denied
</Directory>

# Match API container: no DirectoryIndex UI. Playable shell lives on Hostinger only.
DirectoryIndex disabled
<IfModule mod_headers.c>
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
</IfModule>

